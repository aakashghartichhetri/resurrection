services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resurrection
      POSTGRES_USER: resurrection
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resurrection_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resurrection -d resurrection"]
      interval: 4s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resurrection
      SPRING_DATASOURCE_USERNAME: resurrection
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-resurrection_dev}
      APP_USERNAME: ${APP_USERNAME:-resurrection}
      APP_PASSWORD: ${APP_PASSWORD:-dev-only-change-me}
      APP_SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:

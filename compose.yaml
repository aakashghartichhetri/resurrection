# Local development: DB is internal. No host 5433 mapping to conflict with existing Postgres.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resurrection
      POSTGRES_USER: resurrection
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resurrection_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resurrection -d resurrection"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resurrection
      SPRING_DATASOURCE_USERNAME: resurrection
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-resurrection_dev}
      APP_USERNAME: ${APP_USERNAME:-resurrection}
      APP_PASSWORD: ${APP_PASSWORD:-dev-only-change-me}
      APP_SEED_DEMO: "true"
      APP_FAULTS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 55s
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

name: Verify Resurrection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run replay safety check without database dependencies
        run: bash scripts/replay-check.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Java tests with PostgreSQL Testcontainers
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Audit frontend dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: UI logic tests
        working-directory: frontend
        run: npm test
      - name: Type check and production bundle
        working-directory: frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [replay, backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the complete local application
        run: docker compose up -d --build --wait
      - name: End-to-end workflow, retry, failure and recovery checks
        run: bash scripts/smoke-test.sh
      - name: Verify workflow history survives API restart
        run: bash scripts/restart-check.sh
      - name: Verify PostgreSQL backup can restore into disposable database
        run: bash scripts/verify-backup.sh
      - name: Logs when something fails
        if: failure()
        run: docker compose logs --tail=250
      - name: Stop services without deleting the database
        if: always()
        run: docker compose down

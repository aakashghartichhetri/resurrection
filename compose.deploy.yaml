# Single-operator deployment with automatic HTTPS. Run with: docker compose -p resurrection -f compose.deploy.yaml up -d --build
# Only Caddy publishes ports. PostgreSQL, the API and the app's internal web server stay private.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resurrection
      POSTGRES_USER: resurrection
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resurrection -d resurrection"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resurrection
      SPRING_DATASOURCE_USERNAME: resurrection
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_PRODUCTION: "true"
      APP_SEED_DEMO: "false"
      APP_FAULTS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 55s
    restart: unless-stopped
    networks: [private]

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [private]

  edge:
    image: caddy:2.10.2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
